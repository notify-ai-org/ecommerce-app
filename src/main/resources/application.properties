server.port=8090
spring.threads.virtual.enabled=true

# Notify SDK configuration
notify.ai.properties.base-package=com.notify.ecommerce
notify.ai.properties.application-name=ecommerce-app
notify.ai.properties.client-token=client-aa353f56-614a-4597-be75-9d07e6d3c2e9
# Disable Kafka (not needed for testing)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# H2 persistence — file-backed so customers, carts and orders survive restarts.
# Override with ECOMMERCE_DB_URL (e.g. jdbc:h2:mem:ecommerce for a throwaway DB).
spring.datasource.url=${ECOMMERCE_DB_URL:jdbc:h2:file:./data/ecommerce;AUTO_SERVER=TRUE}
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Storefront session (login state lives in the servlet session)
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# In-app notifications (the bell in the storefront). Notify delivers them to this app's webhook.
# webhook-url: this app's public https URL for POST /api/notifications/webhook; it must equal the
#   endpoint of the tenant's IN_APP channel in Notify. Blank disables in-app recipients.
# signing-secret: the IN_APP channel's signing secret; deliveries are rejected without it.
ecommerce.in-app.webhook-url=${ECOMMERCE_IN_APP_WEBHOOK_URL:}
ecommerce.in-app.signing-secret=${ECOMMERCE_IN_APP_SIGNING_SECRET:}
